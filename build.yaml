overview: Jellyfin 媒体服务器功能增强插件
description: >
  StrmAssistant for Jellyfin 提供 22+ 个功能增强，包括：

  ✅ 媒体信息提取与持久化 - 使用 FFProbe 提取详细媒体流信息

  ✅ 片头片尾自动检测 - 基于音频指纹和 MediaSegment API

  ✅ 多版本自动合并 - 智能合并不同质量版本（4K、1080p 等）

  ✅ 中文搜索增强 - 繁简混合、拼音首字母搜索

  ✅ 字幕自动扫描 - 独立扫描外挂字幕文件

  ✅ 拼音排序 - 中文内容按拼音首字母排序

  ✅ TMDB 元数据增强 - 演职人员、剧集组等

  原 Emby 版本改造，完全使用 Jellyfin 公共 API，稳定可靠。
category: Library
artifacts:
