changelog: >
  ### Version 0.0.2 (2026-01-30)

  🎉 首个 Jellyfin 版本发布！

  #### 新特性

  - ✨ 完全重写，移除 Harmony 依赖，使用 Jellyfin 公共 API
  - ✨ 支持 Jellyfin 10.10.0+ 的 MediaSegment API
  - ✨ 优化的中文搜索引擎，支持繁简混合和拼音搜索
  - ✨ 改进的多版本合并逻辑
  - ✨ 新增计划任务管理界面

  #### 改进

  - 🔧 更稳定的媒体信息提取（使用 IMediaEncoder）
  - 🔧 更高效的字幕扫描（批量处理）
  - 🔧 更智能的拼音排序

  #### 架构变化

  - 🏗️ 新增适配器层（LibraryManagerAdapter、MediaEncoderAdapter）
  - 🏗️ 服务化架构（MediaInfoService、IntroDetectionService 等）
  - 🏗️ 标准的 .NET DI 容器集成

  #### 兼容性

  - 📌 最低要求：Jellyfin 10.10.0
  - 📌 推荐版本：Jellyfin 10.10.3+
  - 📌 目标框架：.NET 8.0
